apply plugin: IntegrationTestsPlugin

dependencies {
    implementation project(":customer-service:customer-service-domain")

    //implementation "io.eventuate.common.database:eventuate-common-jdbc"

    implementation "org.springframework.boot:spring-boot-starter-data-jpa"

    integrationTestImplementation "io.eventuate.common.database:eventuate-common-database-testcontainers:$eventuateCommonDatabaseVersion"
    implementation "com.mysql:mysql-connector-j:$mysqlConnectorVersion"
    implementation "org.postgresql:postgresql:$postgresqlVersion"


    integrationTestImplementation "io.eventuate.common.testcontainers:eventuate-common-testcontainers"
    integrationTestImplementation "org.springframework.boot:spring-boot-starter-data-jpa-test"

}

task("postgresIntegrationTest", type: Test) {
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    shouldRunAfter test
}

check.dependsOn postgresIntegrationTest

postgresIntegrationTest {
    systemProperty "spring.profiles.active", "postgres"
}
