dependencies {
    testImplementation "org.springframework.boot:spring-boot-starter-jdbc"
    testImplementation "org.springframework.boot:spring-boot-starter-test"

    testImplementation 'mysql:mysql-connector-java:8.0.21'
    testRuntimeOnly ("org.postgresql:postgresql:$postgresqlVersion") {
        exclude group: "org.slf4j", module: "slf4j-simple"
    }
    testRuntimeOnly "com.microsoft.sqlserver:mssql-jdbc:$mssqlJdbcVersion"
}

test {
    if (!project.ext.has("verifyDbIdMigration")) {
        exclude '**/DbIdMigrationVerificationTest**'
    }

    forkEvery 1
}
